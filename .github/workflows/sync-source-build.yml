name: Sync compiled site from winXP source
# 2026-10-10: rebuild after Coy dragging fix in private winXP source.
# Bloxify mix: track melody continuously when assigning instruments.
# Rebuild the published site from latest winXP source, including Bloxify, public/audios, active backend URLs, and Coy chatbot UI changes.
# 2026-10-10: rebuild after Coy wording and chatbot endpoint fixes.
# 2026-10-10: remove all yoink references from Coy source.
# 2026-10-10: rebuild after Gemini backend and Coy integration fixes.
# 2026-10-10: rebuild again after final Coy sprite sizing adjustment.
# 2026-10-10: remove the Windows XP virus notification balloon.
# 2026-10-10: rebuild Coy chat close behavior, greetings, and Roblox-style bubble polish.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-compiled-site
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published site
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false

      - name: Check for the private source token
        id: token-check
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.WINXP_SOURCE_TOKEN }}
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing WINXP_SOURCE_TOKEN. Add a repository Actions secret with read access to bagoffish/winXP."
            exit 1
          fi

      - name: Check out private source repository
        if: steps.token-check.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: bagoffish/winXP
          ref: main
          path: source
          token: ${{ secrets.WINXP_SOURCE_TOKEN }}
          submodules: false

      - name: Skip when source has not changed
        id: source-check
        if: steps.token-check.outputs.available == 'true'
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [ -f site-source-commit.txt ] && [ "$(tr -d '\r\n' < site-source-commit.txt)" = "$SOURCE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source is unchanged at $SOURCE_SHA; no build needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building source commit $SOURCE_SHA."
          fi

      - name: Set up Node.js
        if: steps.source-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: source/.nvmrc
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Install dependencies and build
        if: steps.source-check.outputs.changed == 'true'
        working-directory: source
        env:
          CI: "false"
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Verify compiled site assets
        if: steps.source-check.outputs.changed == 'true'
        working-directory: source
        shell: bash
        run: |
          test -s build/index.html || { echo "::error::Build is missing index.html"; exit 1; }
          test -s build/asset-manifest.json || { echo "::error::Build is missing asset-manifest.json"; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = JSON.parse(fs.readFileSync('build/asset-manifest.json', 'utf8'));
          const files = Object.values(manifest.files || {});
          if (!files.length) throw new Error('Asset manifest contains no files');
          const missing = files
            .filter((file) => typeof file === 'string' && file.startsWith('./'))
            .map((file) => file.slice(2))
            .filter((file) => !fs.existsSync(path.join('build', file)));
          if (missing.length) throw new Error('Missing built assets: ' + missing.join(', '));
          console.log('Verified ' + files.length + ' compiled asset references.');
          NODE

      - name: Publish compiled files while preserving avatar history
        if: steps.source-check.outputs.changed == 'true'
        shell: bash
        run: |
          rsync -a source/build/ ./ --exclude='.git/'
          printf '%s\n' '${{ steps.source-check.outputs.sha }}' > site-source-commit.txt
          test -s index.html || { echo "::error::Published site is missing index.html"; exit 1; }
          test -s asset-manifest.json || { echo "::error::Published site is missing asset-manifest.json"; exit 1; }
          test "$(tr -d '\r\n' < site-source-commit.txt)" = '${{ steps.source-check.outputs.sha }}' || { echo "::error::Published source SHA does not match checked-out source"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The private source checkout is a nested repository used only to build Coy companion updates.
          # Never stage it as a submodule pointer in the public site repository.
          git add -A -- . ':(exclude)source'
          if git diff --cached --quiet; then
            echo "Build produced no file changes."
          else
            git commit -m "Build site from winXP source ${{ steps.source-check.outputs.sha }}"
            # Another workflow or manual commit may update main during the build.
            # Rebase onto the newest main and retry a rejected push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Could not rebase the built site onto main without conflicts."
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              echo "Push attempt $attempt failed; fetching the latest main and retrying."
            done
            echo "::error::Could not publish after three attempts."
            exit 1
          fi
